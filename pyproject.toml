[project]
name = "sim6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinny", email = "vincentni2007@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "pyopengl>=3.1.10",
    "pyqt6>=6.12.0",
    "pyqtgraph>=0.14.0",
    "scipy>=1.18.1",
]

[project.scripts]
sim6 = "sim6:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
